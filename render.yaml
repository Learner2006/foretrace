services:


  # 2. FastAPI Backend Web Service
  - type: web
    name: foretrace-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ENV
        value: prod

      - key: GROQ_API_KEY
        sync: false # Must be set in Render dashboard
      - key: API_KEY
        generateValue: true # Secure random string generated by Render
      - key: ADMIN_API_KEY
        generateValue: true # Secure random admin string generated by Render
      - key: FRONTEND_URL
        fromService:
          type: web
          name: foretrace-frontend
          property: url

  # 3. React Static Frontend Site
  - type: web
    name: foretrace-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: foretrace-backend
          property: url
      - key: VITE_API_TOKEN
        fromService:
          type: web
          name: foretrace-backend
          property: envVar
          envVarKey: API_KEY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
