version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: foretrace-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foretrace-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - GROQ_API_KEY=${GROQ_API_KEY:-demo}
      - API_KEY=demo_token
      - ADMIN_API_KEY=demo_admin_token
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - redis
    restart: unless-stopped
